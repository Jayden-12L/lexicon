<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ee"><title>Lexicon — Your learning library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#f5f3ee;--paper:#fffefa;--ink:#20231f;--muted:#85877f;--line:#e8e5dc;--accent:#536b5b;--soft:#e9eee8;--gold:#b28a51;--shadow:0 12px 36px #292d2410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{padding:30px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#f8f6f1}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 38px}.mark{width:32px;height:32px;border-radius:10px;background:#28372e;color:#f8f6ef;display:grid;place-items:center;font-family:Georgia;font-size:19px}.brand-name{font-family:'Playfair Display';font-size:22px;letter-spacing:.2px}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#a09f96;padding:0 13px 10px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#686d65;text-align:left;padding:11px 13px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button.active{background:#e9ede7;color:#2e4838;font-weight:600}.nav .ico{width:17px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:15px 12px;color:var(--muted);font-size:11px;line-height:1.6}.profile{border-top:1px solid var(--line);padding:18px 10px 0;display:flex;gap:10px;align-items:center}.avatar{width:32px;height:32px;border-radius:50%;background:#e3e8df;color:#49604f;display:grid;place-items:center;font-weight:700}.profile small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.main{max-width:1400px;width:100%;margin:auto;padding:36px 54px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}.top-right{display:flex;gap:10px;align-items:center}.search{border:1px solid var(--line);background:var(--paper);padding:10px 13px;border-radius:9px;width:220px;outline:none}.search:focus{border-color:#9cab9c}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 15px;border-radius:8px;font-size:12px}.btn.primary{background:#30483a;color:white;border-color:#30483a}.btn:hover{filter:brightness(.97)}h1,h2,h3,p{margin-top:0}h1{font:500 38px 'Playfair Display';letter-spacing:-.6px;margin:9px 0 8px}h2{font:500 23px 'Playfair Display';margin:0 0 7px}h3{font-size:14px;margin-bottom:6px}.sub{color:var(--muted);font-size:13px}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.date{font-size:11px;color:var(--muted);padding-bottom:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}.stat,.panel,.video-card,.word-card{background:var(--paper);border:1px solid var(--line);border-radius:12px}.stat{padding:19px 20px}.stat-label{color:var(--muted);font-size:11px}.stat-value{font:500 29px 'Playfair Display';margin:9px 0 3px}.stat-note{font-size:10px;color:#829080}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-head h2{font-size:21px}.text-btn{border:0;background:none;color:var(--accent);font-size:12px;padding:5px}.video-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.video-card{padding:18px;transition:.2s}.video-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#637a68;background:#edf1eb;padding:6px 8px;border-radius:5px}.time{font-size:10px;color:var(--muted)}.video-title{font:500 19px 'Playfair Display';line-height:1.3;margin:0 0 8px}.video-desc{color:var(--muted);font-size:11px;line-height:1.6;margin-bottom:15px}.card-bottom{border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.word-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.word-card{padding:15px}.word{font:500 18px 'Playfair Display';margin-bottom:5px}.definition{font-size:11px;line-height:1.5;color:var(--muted)}.page-title{margin-bottom:24px}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}.list{display:grid;gap:10px}.list-item{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.list-item strong{font:500 17px 'Playfair Display'}.list-item p{color:var(--muted);font-size:11px;margin:5px 0 0}.pill{font-size:10px;color:#657a67;background:#edf1eb;border-radius:20px;padding:6px 9px;white-space:nowrap}.empty{padding:40px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px}.detail{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:26px;max-width:850px}.detail h2{font-size:29px}.detail-section{padding:18px 0;border-top:1px solid var(--line)}.detail-section h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}.detail-section p,.detail-section li{font-size:13px;line-height:1.75;color:#555b53}.detail-actions{display:flex;gap:8px;margin-top:20px}.modal-back{position:fixed;inset:0;background:#17201966;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(540px,100%);background:var(--paper);border-radius:14px;padding:25px;box-shadow:0 25px 80px #0002}.modal h2{margin-bottom:20px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea{border:1px solid var(--line);border-radius:8px;background:white;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.study-box{max-width:680px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center}.study-word{font:500 36px 'Playfair Display';margin:25px 0}.study-answer{background:#f2f2ec;padding:18px;border-radius:9px;line-height:1.6;color:#555}.mobile-head{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;z-index:5;height:66px;padding:7px 8px;border-right:0;border-top:1px solid var(--line);background:#faf9f5ed;backdrop-filter:blur(15px)}.brand,.nav-label,.side-bottom,.profile{display:none}.nav{display:flex;justify-content:space-around}.nav button{flex-direction:column;gap:2px;padding:5px 9px;font-size:9px}.nav .ico{font-size:17px}.main{padding:24px 18px 95px}.top{margin-bottom:28px}.search{width:130px}.welcome{align-items:start;flex-direction:column;gap:8px}h1{font-size:32px}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:24px}.video-grid{grid-template-columns:1fr}.word-row{grid-template-columns:1fr 1fr}.top .eyebrow{display:none}}
@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{display:none}.word-row{grid-template-columns:1fr}.top-right .search{width:115px}.btn{padding:10px}}
</style></head>
<body><div class="shell">
<aside class="side"><div class="brand"><div class="mark">L</div><div><div class="brand-name">Lexicon</div><div class="brand-sub">A learning library</div></div></div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
<button class="active" data-page="home"><span class="ico">⌂</span>Home</button><button data-page="library"><span class="ico">▤</span>Library</button><button data-page="vocabulary"><span class="ico">Aa</span>Vocabulary</button><button data-page="study"><span class="ico">✳</span>Study</button><button data-page="settings"><span class="ico">⚙</span>Settings</button></nav><div class="side-bottom">A quieter place to keep<br>what you learn.</div><div class="profile"><div class="avatar">D</div><div><strong style="font-size:12px">Dad's library</strong><small>Personal workspace</small></div></div></aside>
<main class="main"><div class="top"><div class="eyebrow">YOUR PERSONAL KNOWLEDGE SPACE</div><div class="top-right"><input id="globalSearch" class="search" placeholder="⌕  Search library"><button class="btn primary" id="addBtn">＋ Add video</button></div></div><div id="view"></div></main></div><div id="modalRoot"></div>
<script>
const starter=[
{id:'a1',title:'10 Advanced English Words You Should Know',channel:'English Learning',date:'Today',duration:'12 min',summary:'A collection of useful advanced words and how to use them naturally in conversation.',category:'Vocabulary',words:[{word:'Meticulous',definition:'Showing great attention to detail; very careful and precise.',example:'She was meticulous when reviewing the report.'},{word:'Ambiguous',definition:'Having more than one possible meaning; unclear.',example:'His response was ambiguous.'},{word:'Resilient',definition:'Able to recover quickly from difficulties.',example:'The team remained resilient despite setbacks.'}],points:['Context helps determine the meaning of unfamiliar words.','Precise vocabulary can make communication clearer.']},
{id:'a2',title:'Common English Expressions Native Speakers Use',channel:'Everyday English',date:'Yesterday',duration:'18 min',summary:'Everyday expressions, their meanings, and examples of when they sound natural.',category:'Expressions',words:[{word:'A blessing in disguise',definition:'Something that seems bad at first but leads to something good.',example:'Missing the train was a blessing in disguise; I met an old friend.'},{word:'Get the hang of',definition:'To learn how to do something after practicing.',example:'It took a few lessons to get the hang of it.'}],points:['Learn expressions as complete phrases.','Pay attention to the situation and tone in which an expression is used.']},
{id:'a3',title:'The Difference Between Affect and Effect',channel:'Grammar Desk',date:'Oct 30',duration:'9 min',summary:'A practical explanation of two commonly confused English words.',category:'Grammar',words:[{word:'Affect',definition:'Usually a verb meaning to influence something.',example:'The weather can affect your mood.'},{word:'Effect',definition:'Usually a noun meaning a result or consequence.',example:'The new rule had a positive effect.'}],points:['Affect is usually a verb.','Effect is usually a noun.']}
];
let videos=JSON.parse(localStorage.getItem('lexicon-videos')||'null')||starter;
let page='home',selected=null,search='';
const save=()=>localStorage.setItem('lexicon-videos',JSON.stringify(videos));
const allWords=()=>videos.flatMap(v=>v.words.map(w=>({...w,source:v.title,videoId:v.id})));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;selected=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('globalSearch').addEventListener('input',e=>{search=e.target.value; if(search.trim()){page='library';selected=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='library'));}render()});
document.getElementById('addBtn').onclick=()=>openModal();
function render(){const root=document.getElementById('view');if(selected){let v=videos.find(x=>x.id===selected);if(v){root.innerHTML=detail(v);return;}selected=null}
if(page==='home')root.innerHTML=home();else if(page==='library')root.innerHTML=library();else if(page==='vocabulary')root.innerHTML=vocabulary();else if(page==='study')root.innerHTML=study();else root.innerHTML=settings();
root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;render()});
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(videos.find(v=>v.id===b.dataset.edit)));
root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Delete this video and its notes?')){videos=videos.filter(v=>v.id!==b.dataset.delete);save();render()}});
const reveal=root.querySelector('#reveal');if(reveal)reveal.onclick=()=>{root.querySelector('#answer').hidden=false;reveal.hidden=true};
const next=root.querySelector('#nextCard');if(next)next.onclick=()=>{studyIndex=(studyIndex+1)%allWords().length;render()};
}
function home(){let words=allWords();return `<div class="welcome"><div><div class="eyebrow">SUNDAY, NOVEMBER 8</div><h1>A little more knowledge,<br>every day.</h1><p class="sub">Your learning, thoughtfully collected in one place.</p></div><div class="date">Your library at a glance</div></div><div class="stats"><div class="stat"><div class="stat-label">VIDEOS IN LIBRARY</div><div class="stat-value">${videos.length}</div><div class="stat-note">Your saved lessons</div></div><div class="stat"><div class="stat-label">VOCABULARY WORDS</div><div class="stat-value">${words.length}</div><div class="stat-note">Collected across videos</div></div><div class="stat"><div class="stat-label">LEARNING AREAS</div><div class="stat-value">${new Set(videos.map(v=>v.category)).size}</div><div class="stat-note">Growing knowledge</div></div></div><div class="section-head"><h2>Recently collected</h2><button class="text-btn" onclick="go('library')">View library →</button></div><div class="video-grid">${videos.slice().reverse().slice(0,4).map(card).join('')}</div><div class="section-head"><h2>Words to remember</h2><button class="text-btn" onclick="go('vocabulary')">All vocabulary →</button></div><div class="word-row">${words.slice(0,3).map(w=>`<div class="word-card"><div class="word">${esc(w.word)}</div><div class="definition">${esc(w.definition)}</div></div>`).join('')}</div>`}
function card(v){return `<article class="video-card"><div class="card-top"><span class="tag">${esc(v.category)}</span><span class="time">${esc(v.date)} · ${esc(v.duration)}</span></div><div class="video-title">${esc(v.title)}</div><div class="video-desc">${esc(v.summary)}</div><div class="card-bottom"><span>${v.words.length} key terms · ${v.points.length} takeaways</span><button class="text-btn" data-open="${v.id}">Open notes →</button></div></article>`}
function library(){let q=search.toLowerCase();let items=videos.filter(v=>(v.title+' '+v.summary+' '+v.category+' '+v.channel).toLowerCase().includes(q));return `<div class="page-title"><div class="eyebrow">YOUR COLLECTION</div><h1>Library</h1><p class="sub">Every lesson, organized and ready to revisit.</p></div><div class="toolbar"><input class="search" style="width:100%" placeholder="Search videos, topics, or ideas…" value="${esc(search)}" id="libSearch"></div><div class="list">${items.length?items.slice().reverse().map(v=>`<div class="list-item"><div><strong>${esc(v.title)}</strong><p>${esc(v.summary)}</p><p>${v.words.length} vocabulary terms · ${esc(v.date)}</p></div><div style="display:flex;align-items:center;gap:12px"><span class="pill">${esc(v.category)}</span><button class="text-btn" data-open="${v.id}">Open →</button></div></div>`).join(''):'<div class="empty">No videos match that search.</div>'}</div>`}
function vocabulary(){let q=search.toLowerCase(),words=allWords().filter(w=>(w.word+' '+w.definition).toLowerCase().includes(q));return `<div class="page-title"><div class="eyebrow">YOUR PERSONAL DICTIONARY</div><h1>Vocabulary</h1><p class="sub">Words worth keeping, with definitions and examples from your lessons.</p></div><div class="toolbar"><input class="search" id="wordSearch" placeholder="Search a word or definition…" value="${esc(search)}"></div><div class="list">${words.length?words.map(w=>`<div class="list-item"><div><strong>${esc(w.word)}</strong><p>${esc(w.definition)}</p><p><i>${esc(w.example)}</i></p><p>From: ${esc(w.source)}</p></div></div>`).join(''):'<div class="empty">No vocabulary found.</div>'}</div>`}
let studyIndex=0;function study(){let words=allWords();if(!words.length)return '<div class="empty">Add a video with vocabulary to begin studying.</div>';let w=words[studyIndex%words.length];return `<div class="page-title"><div class="eyebrow">REVIEW & REMEMBER</div><h1>Study</h1><p class="sub">A small review session using words from your library.</p></div><div class="study-box"><div class="eyebrow">WORD ${studyIndex+1} OF ${words.length}</div><div class="study-word">${esc(w.word)}</div><button class="btn" id="reveal">Reveal definition</button><div class="study-answer" id="answer" hidden><strong>${esc(w.definition)}</strong><p style="margin:12px 0 0"><i>${esc(w.example)}</i></p></div><div style="margin-top:22px"><button class="btn primary" id="nextCard">Next word →</button></div></div>`}
function settings(){return `<div class="page-title"><div class="eyebrow">PREFERENCES</div><h1>Settings</h1><p class="sub">Manage your Lexicon workspace.</p></div><div class="detail"><div class="detail-section" style="border:0"><h3>Workspace</h3><p>Dad's library · This prototype stores data in this browser only.</p></div><div class="detail-section"><h3>Automatic capture</h3><p>Not connected yet. The next development milestone is a browser extension that can detect watched YouTube videos on supported computers.</p><span class="pill">Coming in a later milestone</span></div><div class="detail-section"><h3>Cross-device sync</h3><p>Cloud accounts and synchronization will be added after the interface prototype.</p></div><div class="detail-section"><h3>Data</h3><p>Your current sample and edited notes are saved in this browser's local storage.</p><button class="btn" id="exportData">Export library as JSON</button></div></div>`}
function detail(v){return `<div class="page-title"><button class="text-btn" onclick="selected=null;render()">← Back to library</button></div><div class="detail"><div class="card-top"><span class="tag">${esc(v.category)}</span><span class="time">${esc(v.date)} · ${esc(v.duration)}</span></div><h2>${esc(v.title)}</h2><p class="sub">${esc(v.channel)}</p><div class="detail-section"><h3>Overview</h3><p>${esc(v.summary)}</p></div><div class="detail-section"><h3>Vocabulary & definitions</h3>${v.words.map(w=>`<p><strong>${esc(w.word)}</strong> — ${esc(w.definition)}<br><i>${esc(w.example)}</i></p>`).join('')}</div><div class="detail-section"><h3>Key takeaways</h3><ul>${v.points.map(p=>'<li>'+esc(p)+'</li>').join('')}</ul></div><div class="detail-actions"><button class="btn primary" data-edit="${v.id}">Edit notes</button><button class="btn" data-delete="${v.id}">Delete</button></div></div>`}
function openModal(v=null){let editing=!!v;let data=v||{title:'',channel:'',date:'Today',duration:'',summary:'',category:'Vocabulary',words:[],points:[]};document.getElementById('modalRoot').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal"><h2>${editing?'Edit video notes':'Add a video'}</h2><form id="videoForm"><div class="field"><label>Video title</label><input name="title" required value="${esc(data.title)}"></div><div class="field"><label>Video URL (optional for this prototype)</label><input name="url" placeholder="https://youtube.com/watch?v=…" value="${esc(data.url||'')}"></div><div class="field"><label>Channel / source</label><input name="channel" value="${esc(data.channel)}"></div><div class="field"><label>Topic</label><input name="category" value="${esc(data.category)}"></div><div class="field"><label>Summary</label><textarea name="summary">${esc(data.summary)}</textarea></div><div class="field"><label>Vocabulary (one per line: word | definition | example)</label><textarea name="words" placeholder="Meticulous | Very careful | She is meticulous.">${esc(data.words.map(w=>[w.word,w.definition,w.example].join(' | ')).join('\n'))}</textarea></div><div class="field"><label>Key takeaways (one per line)</label><textarea name="points">${esc(data.points.join('\n'))}</textarea></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">Save notes</button></div></form></div></div>`;document.getElementById('cancel').onclick=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')document.getElementById('modalRoot').innerHTML=''};document.getElementById('videoForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),words=String(f.get('words')).split('\n').filter(Boolean).map(line=>{let a=line.split('|').map(s=>s.trim());return{word:a[0]||'',definition:a[1]||'',example:a[2]||''}}).filter(w=>w.word);let next={...data,id:data.id||'v'+Date.now(),title:f.get('title'),url:f.get('url'),channel:f.get('channel')||'YouTube',date:data.date||'Today',duration:data.duration||'—',category:f.get('category')||'English',summary:f.get('summary'),words,points:String(f.get('points')).split('\n').filter(Boolean)};if(editing)videos=videos.map(x=>x.id===v.id?next:x);else videos.push(next);save();document.getElementById('modalRoot').innerHTML='';selected=next.id;render()}}
document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='libSearch'||e.target.id==='wordSearch'){search=e.target.value;let pos=e.target.selectionStart;render();let el=document.getElementById(e.target.id);el.focus();el.setSelectionRange(pos,pos)}});
document.getElementById('view').addEventListener('click',e=>{if(e.target.id==='exportData'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(videos,null,2)],{type:'application/json'}));a.href=url;a.download='lexicon-library.json';a.click();URL.revokeObjectURL(url)}});
render();
</script></body></html>
